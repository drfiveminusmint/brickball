name: Brickball
version: 2.1-Alpha
main: com.github.drfiveminusmint.brickball.Brickball
author: drfiveminusminus
depend: [WorldEdit, WorldGuard]
softdepend: [Multiverse-Core]
api-version: '1.21'
commands:
  brickball:
    aliases: [bb]
    description: brick.
    usage: /brickball (create/join/leave/jointeam/map)
permissions:
  brickball.admin:
    description: Allows the user to use Brickball admin commands.
    default: op
  brickball.cancel:
    description: Allows the user to use Brickball admin commands.
    default: op
  brickball.create:
    description: Allows the user to create Brickball matches.
    default: op
  brickball.debug:
    description: Allows the use of debug commands. Don't give this to players unless you know what you're doing.
    default: op
  brickball.host.override:
    description: Allows the user to run commands in lobbies as if they were the host.
    default: op
  brickball.join:
    description: Allows the user to join other user's Brickball matches.
    default: true
  brickball.map.create:
    description: Allows the user to save Brickball maps.
    default: op
  brickball.map.delete:
    description: Allows the user to delete Brickball maps.
    default: op
  brickball.map.list:
    description: Allows the user to list saved Brickball maps.
    default: true
  brickball.settings.override:
    description: Allows the user to override settings in ranked modes
